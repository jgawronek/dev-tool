## Debugging Process

1. **Capture** — collect the full error message, stack trace, and reproduction steps
2. **Locate** — identify the file:line where the failure originates using Grep/Glob before reading
3. **Isolate** — read the minimal set of files that own the failure site and its callers
4. **Hypothesize** — form one or two ranked root cause hypotheses based on the stack trace
5. **Verify** — run `flutter analyze` or targeted `flutter test` to confirm before patching
6. **Fix minimally** — apply the smallest correct change; do not refactor surrounding code
7. **Prevent** — note structural cause so the same class of bug can be caught earlier

## Diagnostic Commands

```bash
# Static analysis — run first for any reported issue
flutter analyze

# Run all tests
flutter test

# Run with verbose logging to surface runtime errors
flutter run -d macos --verbose

# Check dependency tree for version conflicts
flutter pub deps

# Auto-fix lint issues
dart fix --apply

# Clean stale build artifacts when behavior is inexplicably wrong
flutter clean && flutter pub get
```

## Common Failure Patterns in This Codebase

### ValueNotifier / State Bugs
- Listeners attached in `initState` without disposal in `dispose` → memory leaks and stale callbacks
- `notifyListeners()` called after `dispose()` → "setState called after dispose" errors
- `ValueListenableBuilder` not rebuilding → widget is not listening to the correct `ValueNotifier` instance
- Check `lib/state/tool_state.dart` for the authoritative notifier instances; ensure callers reference the same object

### Tool Registry Wiring Failures
- Tool appears in sidebar but shows blank/wrong content → builder function in `tool_registry.dart` returns wrong widget or throws during construction
- New tool added to `ToolRegistry.tools` but builder not added to `tool_views.dart` → check both files together
- Tool `id` mismatch between registry and state comparisons → grep for the id string across both files

### EditorPane / TextEditingController Issues
- `TextEditingController` used after `dispose()` → always check `mounted` before async setState
- Input not clearing after "Clear" action → verify the controller's `clear()` is called on the correct instance
- Large text causes jank → output field should use `maxLines: null` with a `ScrollView`

### Crypto / pointycastle Failures
- `InvalidCipherTextException` → wrong key size, padding mismatch, or incorrect IV length for the chosen algorithm
- AES requires 16/24/32-byte keys; DES requires 8-byte keys; RSA key parsing failures mean PEM format is malformed
- Encoding issues (UTF-8 vs Latin-1) before passing bytes to cipher → always encode input explicitly
- Check `lib/ui/tool_views.dart` for the crypto tool implementations; key/IV derivation logic is inline

### shared_preferences Persistence Issues
- Value not persisted across restarts → `await prefs.setString(...)` call is missing `await` (fire-and-forget)
- Default value returned unexpectedly → key string typo; grep the exact key across all usages
- State loaded before prefs initialized → check `ToolState.load()` is awaited before `runApp()`

### macOS Sandbox / Platform Errors
- File access denied → missing entitlement in `macos/Runner/*.entitlements`
- Clipboard write fails silently → `Clipboard.setData` returns a Future; ensure it is awaited
- Keyboard shortcut not firing → `CallbackShortcuts` or `Focus` widget not in the correct widget subtree

### Async / Dart Errors
- `Null check operator used on a null value` → `late` field not initialized before first access
- `Bad state: Future already completed` → completer reused or double-resolved
- Unhandled exceptions in async tool logic → wrap with try/catch and surface via `ScaffoldMessenger.of(context).showSnackBar`

## Investigation Approach

**Before reading files**, use Grep to locate the symbol:
```bash
# Find where a tool id is defined and referenced
grep -r "toolId" lib/

# Find all ValueNotifier usages
grep -rn "ValueNotifier\|ValueListenableBuilder" lib/
```

**Read in dependency order**: models → state → registry → tool view → shell

**Check recent changes** when the bug is a regression:
```bash
git log --oneline -20
git diff HEAD~1 -- lib/ui/tool_views.dart
```

**Add targeted debug logging** only when the call path is unclear:
```dart
debugPrint('[DebugTag] value=$value at ${StackTrace.current}');
```
Remove all debug logging before declaring the fix complete.

## Output for Each Issue

- **Root cause:** precise explanation of why the failure occurs at the code level
- **Evidence:** file path, line number, and the specific expression or condition that confirms the diagnosis
- **Fix:** the minimal code change (show before/after diff); do not alter surrounding code
- **Prevention:** the structural pattern that would catch this class of bug earlier (e.g., lint rule, test case, dispose guard)

## Project Constraints

- Do not introduce new dependencies without confirming they are already in `pubspec.yaml`
- Do not add comments that describe what the code does; only add a comment when the WHY is non-obvious
- Follow import ordering: `dart:*` → `package:flutter/*` → third-party packages → local relative imports
- All widget classes use `PascalCase`; all files use `snake_case`; private members prefixed with `_`
- Do not restructure surrounding code during a bug fix — minimal diff only
- macOS is the only production target; do not introduce platform-conditional code for other targets unless explicitly requested
